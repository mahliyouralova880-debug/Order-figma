<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- ================================================= -->
    <!--                      NAVBAR1                      -->
    <!-- ================================================= -->
    <nav class="navbar">
        <div class="container">
            <div class="Flex_text">
                <div class="text1 text">
                    <img src="./assets/icon/🌟.png" alt="">
                    <p>Get 5% Off your first order, <a href="#">Promo: ORDER5</a></p>
                </div>

                <div class="text2 text">
                    <img src="./assets/icon/Location.png" alt="">
                    <p>Regent Street, A4, A4201, London</p>
                    <span>Change Location</span>
                </div>
                <div class=" text3_flex text">
                    <div class="order_icon">
                        <img src="./assets/icon/Full Shopping Basket.png" alt="">
                    </div>
                    <div class="order_text">
                        <p>23 Items</p>
                    </div>
                    <div class="order_text">
                        <p>GBP 79.89</p>
                    </div>
                    <div class="order_icon">
                        <img src="./assets/icon/Forward Button.png" alt="">
                    </div>
                </div>
            </div>
        </div>
    </nav>


    <!-- ================================================= -->
    <!--                     NAVBAR2                       -->
    <!-- ================================================= -->

    <nav class="navbar2">
        <div class="navbar_container navbar_flex">
            <div class="navbar_logo">
                <a href="#">
                    <img src="./assets/image/LOGO 1.png" alt="">
                </a>
            </div>
            <div class="navbar_flex2">
                <p>Home</p>
                <p>Special Offers</p>
                <button class="navbar_btn1">Restaurants</button>
                <p>Track Order</p>
                <button class="navbar_btn2"><a href="#">Login/Signup</a></button>
            </div>
        </div>
    </nav>


    <!-- ================================================= -->
    <!--                     SECTION1                      -->
    <!-- ================================================= -->

    <section>
        <div class="burger-container burger-section">
            <div class="burger-flex">
                <div class="burger-text">
                    <p class="burger-p1">I'm lovin' it!</p>
                    <h1>McDonald’s East London</h1>
                    <div class="burger-flex-p">
                        <p>Minimum Order: 12 GBP</p>
                        <p>Delivery in 20-25 Minutes</p>
                    </div>
                </div>
                <div class="burger-img">
                    <img src="./assets/image/Rectangle 44.png" alt="">
                </div>
            </div>
        </div>
    </section>


    <!-- ================================================= -->
    <!--                     SECTION2                      -->
    <!-- ================================================= -->


    <section>
        <div class="from-container">
            <div class="from-flex">
                <div class="from-text">
                    <p>All Offers from McDonald’s East London</p>
                </div>
                <div class="from-input">
                    <input type="search" placeholder="Search from menu...">
                </div>
            </div>
        </div>
    </section>

    <!-- ================================================= -->
    <!--                     SECTION3                      -->
    <!-- ================================================= -->
</body>

</html>
